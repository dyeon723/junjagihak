  --opt-font-size: .84rem;      /* 보기 글자 크기 */
  --opt-line-height: 1.5;       /* 보기 줄간격 ↑ = 보기칸 높이 ↑ */
  --opt-padding-y: 7px;         /* 보기 위/아래 여백 ↑ = 보기칸 높이 ↑ */
  --opt-padding-x: 9px;         /* 보기 좌/우 여백 */

  /* 해설칸 (책 해설 · AI 추가해설) — 여기를 키우면 해설칸 높이가 커짐 */
  --expl-font-size: .83rem;     /* 해설 글자 크기 */
  --expl-line-height: 1.6;      /* 해설 줄간격 ↑ = 해설칸 높이 ↑ */
  --expl-padding-top: 10px;     /* 해설 위쪽 여백 */
  --expl-padding-x: 15px;       /* 해설 좌/우 여백 */
  --expl-padding-bottom: 12px;  /* 해설 아래쪽 여백 ↑ = 해설칸 높이 ↑ */

  /* 수식 박스 (fb0 · 공식 박스) */
  --fb0-line-height: 1.6;       /* 수식 박스 줄간격 */
  --fb0-padding-y: 8px;         /* 수식 박스 위/아래 여백 */
  --fb0-padding-x: 14px;        /* 수식 박스 좌/우 여백 */

  /* 블록 수식(\[ ]) 기본 여백 — 최소값만 유지. 분수 여러 줄처럼
     실제로 더 필요한 경우는 JS(fitMathBoxes)가 자동으로 보충함 */
  --katex-display-margin-y: .2em;   /* 블록 수식 위/아래 바깥 간격 (KaTeX 기본은 1em이라 넓음) */
  --katex-display-padding-y: 0px;   /* 블록 수식 위/아래 기본 안쪽 여백 */
  --katex-html-padding-y: 0px;

  /* 팁 박스(암기 팁) */
  --tip-padding-y: 8px;
  --tip-padding-x: 12px;

  /* 카드(문제 하나) 모서리 둥글기 */
  --card-radius: 12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}

/* ── 헤더 (컴팩트) ── */
.hd{
  background:linear-gradient(135deg,#161929,#0d0f18);
  border-bottom:2px solid var(--ac);
  padding:8px 14px;
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:10px;
}
.hd-title{font-size:.95rem;font-weight:900;color:var(--ac);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}

/* 진도 칩 */
.progress-chip{
  font-size:.68rem;font-weight:700;
  background:var(--sf2);border:1px solid var(--bd);
  border-radius:20px;padding:3px 9px;
  color:var(--tx2);white-space:nowrap;
}
.progress-chip span{color:var(--ac);}

/* 통계/필터 버튼 */
.stat-btn{
  display:flex;align-items:center;gap:3px;
  background:var(--sf2);border:1px solid var(--bd);border-radius:20px;
  padding:3px 9px;font-size:.68rem;font-weight:700;
  cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap;
  color:var(--tx2);
}
@media(hover:hover){.stat-btn:hover{filter:brightness(1.2);}}
.stat-btn .lbl{font-weight:700;}
#btnAll.on{border-color:var(--ac);background:rgba(91,156,246,.15);color:var(--ac);}#btnNg.on{border-color:var(--ng);background:rgba(240,90,90,.12);color:var(--ng);}
#btnWeak.on{border-color:#f5963a;background:rgba(245,150,50,.12);color:#f5963a;}

/* 자주 틀림 드롭다운 */
.weak-wrap{position:relative;}
.weak-menu{
  display:none;position:absolute;top:calc(100% + 6px);right:0;
  background:var(--sf);border:1px solid var(--bd);border-radius:10px;
  padding:5px 0;min-width:140px;z-index:50;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.weak-menu.open{display:block;}
.weak-item{
  padding:8px 14px;font-size:.76rem;color:var(--tx2);cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;
}
.weak-item:hover{background:rgba(245,150,50,.1);color:#f5963a;}

/* 버튼 */
.fb{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);padding:4px 11px;border-radius:20px;font-size:.72rem;cursor:pointer;font-family:inherit;}
.fb.on{background:var(--ac);color:#fff;border-color:var(--ac);}
.fb:active{filter:brightness(1.25);}
.card[data-rv] .rtbtn{display:none;}
.fb.danger{color:var(--ng);border-color:rgba(240,90,90,.3);background:rgba(240,90,90,.08);}
.fb.danger:active{filter:brightness(1.2);}

/* ── 기능버튼 바 ── */
.sb{padding:7px 18px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;}
.sb-btns{display:flex;gap:6px;flex-wrap:wrap;}

/* ── 메인 ── */
.main{max-width:860px;margin:0 auto;padding:16px 14px 60px;display:flex;flex-direction:column;gap:11px;}

/* ── 객관식 카드 ── */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--card-radius);overflow:hidden;transition:border-color .2s;}
.card.answered-ok{border-color:rgba(62,207,142,.35);}
.card.answered-ng{border-color:rgba(240,90,90,.35);}

/* 문제 헤더 */
.ch{display:flex;align-items:flex-start;gap:10px;padding:13px 15px 0;}
.cn{background:var(--ac);color:#fff;font-weight:900;font-size:.75rem;min-width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cn.ok{background:var(--ok);}
.cn.ng{background:var(--ng);}
.ct{flex:1;padding-bottom:11px;}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px;}
.tg{font-size:.64rem;padding:2px 7px;border-radius:9px;font-weight:500;}
.tg-g{background:rgba(91,156,246,.14);color:var(--ac);border:1px solid rgba(91,156,246,.28);}
.tg-s{background:rgba(245,200,66,.13);color:var(--ac2);border:1px solid rgba(245,200,66,.27);}

.tg-at{font-size:.62rem;font-variant-numeric:tabular-nums;border:1px solid transparent;}
.tg-at-none {background:rgba(255,255,255,.04);color:var(--tx3);border-color:transparent;}          /* 미시도 */
.tg-at-zero {background:rgba(240,90,90,.12);color:var(--ng);border-color:rgba(240,90,90,.3);}      /* 0% */
.tg-at-low  {background:rgba(245,150,50,.12);color:#f5963a;border-color:rgba(245,150,50,.3);}      /* 1~49% */
.tg-at-mid  {background:rgba(245,200,66,.12);color:var(--ac2);border-color:rgba(245,200,66,.3);}   /* 50~99% */
.tg-at-full {background:rgba(62,207,142,.12);color:var(--ok);border-color:rgba(62,207,142,.3);}    /* 100% */
.qt{font-size:var(--qt-font-size);line-height:var(--qt-line-height);color:var(--tx);font-weight:500;overflow-x:auto;overflow-y:hidden;max-width:100%;padding-bottom:4px;}

/* 보기 — 항상 표시 */
.opts{padding:0 15px 12px 57px;display:flex;flex-direction:column;gap:4px;}
.opt{display:flex;align-items:flex-start;gap:7px;padding:var(--opt-padding-y) var(--opt-padding-x);border-radius:7px;border:1px solid transparent;font-size:var(--opt-font-size);color:var(--tx2);line-height:var(--opt-line-height);cursor:pointer;transition:all .18s;overflow-x:auto;overflow-y:visible;max-width:100%;}
@media(hover:hover){.opt:hover:not(.lk){background:rgba(91,156,246,.07);border-color:rgba(91,156,246,.2);}}
.on{font-size:.73rem;font-weight:700;min-width:17px;color:var(--tx3);padding-top:1px;flex-shrink:0;}
.opt.cor{background:rgba(62,207,142,.09);border-color:rgba(62,207,142,.35);color:var(--ok)!important;}
.opt.cor .on{color:var(--ok);}
.opt.wrg{background:rgba(240,90,90,.09);border-color:rgba(240,90,90,.3);color:var(--ng)!important;}
.opt.wrg .on{color:var(--ng);}

/* 결과 바 (답 선택 전엔 숨김) */
.res-bar{display:none;border-top:1px solid var(--bd);}
.res-bar.show{display:block;}

/* 정답 표시 줄 */
.ansbar{display:flex;align-items:center;gap:9px;padding:8px 15px;background:rgba(62,207,142,.05);border-bottom:1px solid var(--bd);}
.albl{font-size:.68rem;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.5px;}
.aval{font-weight:900;font-size:.88rem;color:var(--ok);}
.rtbtn{margin-left:auto;background:transparent;color:var(--tx3);border:1px solid var(--bd);padding:4px 11px;border-radius:7px;font-size:.73rem;cursor:pointer;font-family:inherit;transition:all .2s;}
.rtbtn:hover{color:var(--ac);border-color:var(--ac);}

/* 해설 */
.expl{padding:var(--expl-padding-top) var(--expl-padding-x) var(--expl-padding-bottom);font-size:var(--expl-font-size);line-height:var(--expl-line-height);color:var(--tx2);word-break:keep-all;overflow-wrap:break-word;overflow-x:auto;overflow-y:hidden;max-width:100%;}
.expl strong{color:var(--ac2);font-weight:700;}

/* 추가해설 — expl과 동일 렌더링, 구분선으로만 분리 */
.ae-expl{border-top:1px dashed var(--bd);margin-top:0;padding-top:11px;}
.ae-label{font-size:.72rem;font-weight:700;color:var(--ac);margin-bottom:7px;}

/* 수식 박스 */
.fb0{background:#0b0e16;border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:var(--fb0-padding-y) var(--fb0-padding-x);margin:9px 0;line-height:var(--fb0-line-height);overflow-x:auto;max-width:100%;word-break:break-word;}
.fl{margin:1px 0;white-space:nowrap;}

/* KaTeX — 긴 수식 줄바꿈 (분수 여러 줄 등 세로로 긴 수식이 위아래로 잘리지 않도록 여백을 넉넉히 확보) */
.katex-display{overflow-x:auto;overflow-y:visible;margin:var(--katex-display-margin-y) 0;padding:var(--katex-display-padding-y) 0;max-width:100%;}
.katex-display > .katex{max-width:100%;white-space:normal;}
.katex-display > .katex > .katex-html{max-width:100%;overflow-x:auto;overflow-y:visible;padding:var(--katex-html-padding-y) 0;}
.katex{font-size:1em;}

/* aligned 환경 — = 기준 정렬 줄바꿈 */
.katex .base{max-width:100%;}

.tip{background:rgba(245,200,66,.06);border:1px solid rgba(245,200,66,.2);border-radius:6px;padding:var(--tip-padding-y) var(--tip-padding-x);margin-top:8px;font-size:.8rem;color:var(--ac2);word-break:keep-all;}
.tip::before{content:"💡 ";}

/* 표 — 모바일 스크롤 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:9px 0;}
.ctbl{width:100%;border-collapse:collapse;font-size:.79rem;min-width:280px;}
.ctbl th,.ctbl td{border:1px solid var(--bd);padding:5px 9px;text-align:center;white-space:nowrap;}
.ctbl th{background:var(--sf2);color:var(--ac);font-weight:700;}
.ctbl td{color:var(--tx2);}
.gw{margin:11px 0;text-align:center;overflow-x:auto;}

/* ── 주관식 ── */
.sq-wrap{max-width:860px;margin:0 auto;padding:0 14px 60px;display:flex;flex-direction:column;gap:11px;}
.sq-divider{display:flex;align-items:center;gap:10px;padding:4px 0;}
.sq-divider span{font-size:.75rem;font-weight:700;color:var(--ac2);white-space:nowrap;}
.sq-divider::before,.sq-divider::after{content:'';flex:1;height:1px;background:var(--bd);}
.sq-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;}
.sq-hd{display:flex;align-items:center;gap:10px;padding:12px 15px;}
.sq-num{background:var(--ac2);color:#111;font-weight:900;font-size:.75rem;min-width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sq-title{font-size:.88rem;font-weight:700;color:var(--tx);}
.sq-sub{font-size:.7rem;color:var(--tx3);margin-top:2px;}
.sq-body{padding:13px 15px 15px;border-top:1px solid var(--bd);}
.sq-sent{font-size:.87rem;line-height:2.6;color:var(--tx);word-break:keep-all;}
.sq-inp{display:inline-block;min-width:64px;border:none;border-bottom:2px solid var(--ac);background:transparent;color:var(--tx);font-family:inherit;font-size:.87rem;text-align:center;padding:1px 6px;outline:none;transition:all .2s;vertical-align:middle;}
.sq-inp:focus{border-color:var(--ac2);background:rgba(245,200,66,.05);}
.sq-inp.cor{color:var(--ok);border-color:var(--ok);background:rgba(62,207,142,.06);}
.sq-inp.wrg{color:var(--ng);border-color:var(--ng);background:rgba(240,90,90,.06);}
.sq-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;}
.sq-btn-check{background:var(--ac);color:#fff;border:none;padding:6px 18px;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;}
.sq-btn-check:hover{background:#4a87e8;}
.sq-btn-sub{background:transparent;color:var(--tx3);border:1px solid var(--bd);padding:6px 13px;border-radius:8px;font-size:.76rem;cursor:pointer;font-family:inherit;transition:all .2s;}
.sq-btn-sub:hover{color:var(--ac);border-color:var(--ac);}
.sq-score{margin-top:9px;font-size:.83rem;font-weight:700;min-height:1.4em;}
.sq-score.ok{color:var(--ok);}
.sq-score.ng{color:var(--ng);}
.sq-formula-box{background:#0b0e16;border:1px solid var(--bd);border-left:3px solid var(--ac2);border-radius:8px;padding:10px 20px;margin:8px 0;text-align:center;font-size:.95rem;line-height:1.9;overflow-x:auto;}
.sq-ans-box{background:rgba(62,207,142,.06);border:1px solid rgba(62,207,142,.25);border-radius:8px;padding:13px 17px;margin-top:10px;font-size:.84rem;line-height:1.9;color:var(--tx2);display:none;}
.sq-ans-box.show{display:block;}
.sq-ans-box strong{color:var(--ok);}
.sq-show-btn{background:rgba(62,207,142,.12);color:var(--ok);border:1px solid rgba(62,207,142,.3);padding:7px 18px;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:4px;}
.sq-show-btn:hover{background:rgba(62,207,142,.22);}

/* ── 햄버거 버튼 ── */
.hamburger{background:none;border:none;cursor:pointer;padding:6px;display:flex;flex-direction:column;gap:5px;justify-content:center;flex-shrink:0;}
.hamburger span{display:block;width:22px;height:2px;background:var(--tx2);border-radius:2px;transition:all .25s;}
.hamburger:hover span{background:var(--ac);}

/* ── 오버레이 ── */
.menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;backdrop-filter:blur(2px);}
.menu-overlay.open{display:block;}

/* ── 사이드 패널 ── */
.menu-panel{position:fixed;top:0;left:-260px;width:240px;height:100%;background:var(--sf);border-right:1px solid var(--bd);z-index:201;display:flex;flex-direction:column;transition:left .25s cubic-bezier(.4,0,.2,1);}
.menu-panel.open{left:0;}
.menu-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);background:var(--sf2);}
.menu-title{font-size:.9rem;font-weight:700;color:var(--ac);}
.menu-close{background:none;border:none;color:var(--tx3);font-size:1rem;cursor:pointer;padding:2px 6px;border-radius:5px;transition:color .2s;}
.menu-close:hover{color:var(--tx);}
.menu-body{flex:1;padding:10px 0;overflow-y:auto;}
.menu-nav{display:flex;flex-direction:column;}
.menu-item{display:block;padding:12px 20px;font-size:.88rem;color:var(--tx2);text-decoration:none;border-left:3px solid transparent;transition:all .18s;}
.menu-item.on{background:rgba(91,156,246,.12);color:var(--ac);border-left-color:var(--ac);font-weight:700;}
.menu-item:hover{background:rgba(91,156,246,.08);color:var(--ac);border-left-color:var(--ac);}

/* 북마크 아이콘 */
.bm-icon{background:none;border:none;font-size:1rem;cursor:pointer;padding:4px;line-height:1;flex-shrink:0;opacity:.2;}
.bm-icon.on{opacity:1;}

/* ── 공식모음 페이지 뷰 ── */
.formula-page{
  display:none;position:fixed;inset:0;z-index:300;
  background:var(--bg);overflow-y:auto;
}
.formula-page.open{display:block;}
.fp-hd{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,#161929,#0d0f18);
  border-bottom:2px solid var(--ac2);
  padding:10px 16px;
  display:flex;align-items:center;gap:12px;
}
.fp-back{
  background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);
  padding:5px 12px;border-radius:20px;font-size:.78rem;
  cursor:pointer;font-family:inherit;transition:all .2s;
}
.fp-back:hover{background:var(--ac);color:#fff;border-color:var(--ac);}
.fp-title{font-size:.95rem;font-weight:900;color:var(--ac2);}
.fp-body{max-width:700px;margin:0 auto;padding:16px 14px 60px;display:flex;flex-direction:column;gap:12px;}
.fc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;}
.fc-title{
  padding:10px 14px;background:var(--sf2);border-bottom:1px solid var(--bd);
  font-size:.78rem;font-weight:700;color:var(--ac2);
}
.fc-body{padding:12px 14px;font-size:.84rem;line-height:1.9;color:var(--tx2);}
.fc-body .fb0{margin:6px 0;}
.fr{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--bd);}
.fr:last-child{border-bottom:none;}
.fl{color:var(--tx);font-weight:600;font-size:.82rem;}
.fm{margin-left:auto;max-width:100%;overflow:visible;font-size:.92em;line-height:2;}
.fm .katex,.fm .katex-html{white-space:normal;}
.fm .katex-html{display:inline;}
.fc-body{overflow-x:hidden;}
.fc-body .fm, .fc-body .katex-display, .fc-body .katex-display > .katex, .fc-body .katex-display > .katex > .katex-html, .fc-body .eq-wrap{overflow:visible !important;max-width:100%;}
.fc-body .katex-display{margin:0 !important;padding:0 !important;text-align:left;}
.fc-body .katex-display > .katex > .katex-html{padding:0 !important;}
.fc-body .fl:empty{display:none;}
.fc-body .fl:empty + .fm{margin-left:0;}

.fsub{color:var(--ac2);font-weight:700;font-size:.8rem;margin-top:8px;}
.fnote{color:var(--tx3);font-size:.78rem;padding:4px 0;}
.fc-empty{text-align:center;color:var(--tx3);font-size:.84rem;padding:60px 0;line-height:2;}
.top-btn{
  position:fixed;bottom:28px;right:18px;z-index:150;
  width:36px;height:36px;border-radius:50%;
  background:var(--sf2);border:1px solid var(--bd);
  color:var(--tx3);font-size:.85rem;
  cursor:pointer;font-family:inherit;
  opacity:0;pointer-events:none;
  transition:opacity .25s,background .2s,color .2s;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.top-btn.visible{opacity:1;pointer-events:auto;}
.top-btn:hover{background:var(--ac);color:#fff;border-color:var(--ac);}

/* focus 잔상 제거 */
button:focus,button:focus-visible,
.stat-btn:focus,.stat-btn:focus-visible{outline:none;}
.fb:active,.bm-icon:active,.stat-btn:active{filter:brightness(1.2);}

@media(max-width:580px){
  .qt{font-size:.86rem;}
  .sq-sent{font-size:.84rem;}
  .sq-inp{min-width:52px;font-size:.84rem;}
}

<body>

<!-- ══════════════════════════
     헤더 — 제목 + 통계 + 버튼
     ══════════════════════════ -->
<div class="hd">
  <button class="hamburger" onclick="toggleMenu()" aria-label="메뉴">
    <span></span><span></span><span></span>
  </button>
  <div class="hd-title">자계</div><!-- ★ 단원명 수정 -->
  <div class="hd-right">
    <span class="progress-chip"><span id="st-done">0</span>/<span id="st-total">0</span></span>
    <div class="stat-btn" id="btnAll" onclick="setView('all')">전체</div>
    <div class="stat-btn" id="btnNg" onclick="setView('ng')">오답</div>

/* ── 상수 ── */
const N = ['①','②','③','④'];
const KATEX_OPTS = {
  delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
  throwOnError:false
};

/* ── 수식 렌더링 + 칸 높이 자동조절 ──
   KaTeX 렌더링 직후, 수식 글자가 실제로 그려진 위/아래 끝을 재서
   칸 밖으로 삐져나온(=잘리는) 만큼만 여백을 더해준다.
   안 잘리는 수식은 여백을 전혀 추가하지 않는다. */
function fitMathBoxes(scope){
  const root = scope || document;
  const targets = Array.from(root.querySelectorAll(
    '.fb0, .sq-formula-box, .katex-display, .katex-display > .katex > .katex-html, .opt, .expl, .qt'
  )).reverse();               /* 안쪽 요소부터 처리 (중복 여백 방지) */
  targets.forEach(el=>{
    el.style.paddingTop = '';
    el.style.paddingBottom = '';
  });
  targets.forEach(el=>{
    const box = el.getBoundingClientRect();
    if(!box.height) return;
    let top = Infinity, bottom = -Infinity;
    el.querySelectorAll('.katex-html *').forEach(n=>{
      if(n.classList.contains('pstrut') || n.classList.contains('strut')) return;
      const r = n.getBoundingClientRect();
      if(!r.height) return;
      if(r.top < top) top = r.top;
      if(r.bottom > bottom) bottom = r.bottom;
    });
    if(top === Infinity) return;
    const cs = getComputedStyle(el);
    const needTop    = Math.max(0, Math.ceil(box.top - top));        /* 위로 삐져나온 만큼 */
    const needBottom = Math.max(0, Math.ceil(bottom - box.bottom));  /* 아래로 삐져나온 만큼 */
    if(needTop)    el.style.paddingTop    = (parseFloat(cs.paddingTop)    + needTop    + 1) + 'px';
    if(needBottom) el.style.paddingBottom = (parseFloat(cs.paddingBottom) + needBottom + 1) + 'px';
  });
}
/* ── 해설/보기 속 긴 계산식을 '=' 기준으로 자동 줄바꿈 ──
   \( ... \) 안에 '=' 이 2개 이상인 식만 대상으로 하고,
   렌더링 후 실제 너비를 재서 한 줄에 다 안 들어갈 때만
   '=' 단위로 최대한 채워서 다음 줄로 넘긴다.
   예) 1=24*32=113%282 → 다음 줄 =2782=1991
   (중괄호 { } 안에 있는 '=' 은 자르는 기준에서 제외) */

/* 1) 렌더링 전: 대상 식을 표시(span)로 감싸서 원본 LaTeX를 보관 */
function markLongEquations(el){
  el.innerHTML = el.innerHTML.replace(/\\\(([\s\S]*?)\\\)/g, (whole, tex)=>{
    let depth = 0, eq = 0;
    for(const c of tex){
      if(c === '{') depth++;
      else if(c === '}') depth--;
      else if(c === '=' && depth === 0) eq++;
    }
    if(eq < 2) return whole;
    const esc = tex.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return '<span class="eq-wrap" data-tex="' + esc + '">' + whole + '</span>';
  });
}

/* 중괄호 밖의 '=' 을 기준으로 최상위 항목만 분리 */
function topLevelEqParts(tex){
  const parts = []; let depth = 0, cur = '';
  for(const c of tex){
    if(c === '{') depth++;
    else if(c === '}') depth--;
    if(c === '=' && depth === 0){ parts.push(cur); cur = ''; }
    else cur += c;
  }
  parts.push(cur);
  return parts.map(s=>s.trim()).filter(Boolean);
}

/* 화면 밖(숨겨진 곳)에 실제로 그려보고 너비(px)를 재는 도우미 */
let _eqProbe;
function measureTexWidth(tex, refEl){
  if(!_eqProbe){
    _eqProbe = document.createElement('div');
    _eqProbe.style.cssText = 'position:fixed;visibility:hidden;left:-99999px;top:0;white-space:nowrap;';
    document.body.appendChild(_eqProbe);
  }
  _eqProbe.style.fontSize = getComputedStyle(refEl).fontSize;
  try{ katex.render(tex, _eqProbe, {throwOnError:false, displayMode:true}); }
  catch(e){ _eqProbe.textContent = tex; }
  return _eqProbe.getBoundingClientRect().width;
}

/* 2) 렌더링 후: 실제로 칸 너비를 넘는 식만 '=' 기준으로 줄바꿈 */
function reflowLongEquations(scope){
  (scope || document).querySelectorAll('span.eq-wrap[data-tex]').forEach(span=>{
    if(span.dataset.reflowed) return;
    span.dataset.reflowed = '1';

    const host = span.closest('.expl, .opt, .qt, .fb0, .sq-formula-box') || span.parentElement;
    if(!host) return;
    const hcs = getComputedStyle(host);
    const maxW = host.clientWidth - parseFloat(hcs.paddingLeft||0) - parseFloat(hcs.paddingRight||0) - 2;
    if(maxW <= 0) return;
    if(span.getBoundingClientRect().width <= maxW) return; /* 이미 한 줄에 들어가면 그대로 둠 */

    const tex = span.getAttribute('data-tex');
    const parts = topLevelEqParts(tex);
    if(parts.length < 3) return; /* '=' 1개 이하는 줄바꿈 의미 없음 */

    const lineGroups = []; let cur = [parts[0]];
    for(let i=1;i<parts.length;i++){
      const trial = cur.concat(parts[i]);
      if(measureTexWidth(trial.join('='), span) <= maxW){ cur = trial; }
      else { lineGroups.push(cur); cur = [parts[i]]; }
    }
    lineGroups.push(cur);
    if(lineGroups.length < 2) return; /* 결국 한 줄에 다 들어가면 그대로 둠 */

    const rows = lineGroups.map((g,i)=>{
      if(i === 0) return g.length > 1 ? g[0] + ' &= ' + g.slice(1).join(' = ') : g[0];
      return '&= ' + g.join(' = ');
    });
    const alignedTex = '\\begin{aligned} ' + rows.join(' \\\\ ') + ' \\end{aligned}';

    const block = document.createElement('div');
    try{ katex.render(alignedTex, block, {throwOnError:false, displayMode:true}); }
    catch(e){ return; } /* 실패하면 원래 한 줄짜리 식을 그대로 둠 */
    span.replaceWith(block);
  });
}

function renderMath(el){
  markLongEquations(el);
  renderMathInElement(el, KATEX_OPTS);
  reflowLongEquations(el);
  fitMathBoxes(el);
}
/* 폰트 로딩이 늦게 끝나 높이 계산이 어긋나는 경우를 대비해 한 번 더 보정 */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>fitMathBoxes());
}

const STORE_KEY = 'egki_' + document.title.replace(/\s/g,'_');

/* ── 상태 변수 ── */
let wrongSet    = new Set();
let okSet       = new Set();
let bookmarkSet = new Set();
let shufMap     = {};
let selectedMap = {};
let attemptMap  = {};  /* attemptMap[n] = {try, ok} */
let randMode    = false;
let randedOrder = null;  /* 섞인 문제 순서 저장 */
let shufMode    = false;
let bmMode      = false;
let viewMode    = 'all';
let weakPctActive = null;
let lastSeenN   = null;

function shuf(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* 시도 비율 → CSS 클래스 */
function atCls(at){
  if(!at||at.try===0) return 'tg-at-none';
  const r=at.ok/at.try;
  if(r<0.2)  return 'tg-at-zero';
  if(r<0.5)  return 'tg-at-low';
  if(r<0.8)  return 'tg-at-mid';
  return 'tg-at-full';
}
function atHtml(at){
  const cls=atCls(at);
  const txt=at?`${at.ok}/${at.try}`:'-/-';
  return `<span class="tg tg-at ${cls}">${txt}</span>`;
}

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      wrongSet:[...wrongSet],
      okSet:[...okSet],
      selectedMap,
      attemptMap,
      bookmarkSet:[...bookmarkSet],
      lastN: lastSeenN
    }));
  }catch(e){}
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s=JSON.parse(raw);
    const validNs=new Set(QS.filter(q=>q.n!=null).map(q=>q.n));
    wrongSet   = new Set((s.wrongSet||[]).filter(n=>validNs.has(n)));
    okSet      = new Set((s.okSet||[]).filter(n=>validNs.has(n)));
    bookmarkSet= new Set((s.bookmarkSet||[]).filter(n=>validNs.has(n)));
    selectedMap= Object.fromEntries(Object.entries(s.selectedMap||{}).filter(([k])=>validNs.has(parseInt(k))));
    const am=s.attemptMap||{};
    Object.keys(am).filter(k=>validNs.has(parseInt(k))).forEach(k=>{ attemptMap[parseInt(k)]=am[k]; });
    lastSeenN  = validNs.has(s.lastN)?s.lastN:null;
  }catch(e){}
}

/* 통계 업데이트 */
function upStat(){
  const done=okSet.size+wrongSet.size;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-total').textContent=QS.length;
}

/* 전체 렌더 (DOM 재구성) */
function render(){
  let qs = randedOrder
    ? randedOrder.map(n=>QS.find(q=>q.n===n)).filter(Boolean)
    : QS.filter(q=>q.n!=null);
  document.getElementById('main').innerHTML=qs.map(mkCard).join('');
  renderMath(document.getElementById('main'));
  if(viewMode!=='all') applyViewFilter(viewMode, weakPctActive);
  upStat();

/* ── 뷰 필터 ── */

/* 순수 DOM show/hide — alert 없음, render()에서 내부 호출용 */
function applyViewFilter(mode, weakPct){
  document.querySelectorAll('.card').forEach(c=>{
    const n=parseInt(c.dataset.n);
    let show=true;
    if(mode==='ok')   show=okSet.has(n);
    if(mode==='ng')   show=wrongSet.has(n);
    if(mode==='bm')   show=bookmarkSet.has(n);
    if(mode==='weak'){
      const at=attemptMap[n];
      show=!!at&&at.try>0&&(at.ok/at.try*100)<=weakPct;
    }
    c.style.display=show?'':'none';
  });
  /* 오답 뷰: 카드를 초기화해 다시 풀 수 있게 */
  if(mode==='ng'){
    wrongSet.forEach(n=>{
      const card=document.getElementById('q'+n);
      if(!card) return;
      card.querySelectorAll('.opt').forEach(o=>o.className='opt');
      const res=document.getElementById(`q${n}_res`);
      if(res) res.classList.remove('show');
      card.className='card answered-ng';
      const cn=card.querySelector('.cn');
      if(cn) cn.className='cn ng';
    });
  }
}

/* 버튼 강조 업데이트 */
function updateViewBtns(mode, weakPct){
  ['btnAll','btnNg','btnWeak'].forEach(id=>document.getElementById(id).classList.remove('on'));
  if(mode==='all')        document.getElementById('btnAll').classList.add('on');
  else if(mode==='ng')    document.getElementById('btnNg').classList.add('on');
  else if(mode==='weak'){
    document.getElementById('btnWeak').classList.add('on');
    document.querySelector('#btnWeak .lbl').textContent=`≤${weakPct}%`;
  }
}

/* 사용자 클릭 진입점 — 검증 + 상태 저장 + 필터 적용 */
function setView(mode, weakPct){
  document.getElementById('weakMenu').classList.remove('open');
  /* 빈 상태 경고 */
  if(mode==='ok'   && okSet.size===0)   {alert('아직 맞힌 문제가 없어요!');return;}
  if(mode==='ng'   && wrongSet.size===0){alert('아직 틀린 문제가 없어요!');return;}
  if(mode==='weak'){
    const has=QS.some(q=>{const at=attemptMap[q.n];return at&&at.try>0&&(at.ok/at.try*100)<=weakPct;});
    if(!has){alert(`정확률 ${weakPct}% 이하인 문제가 없어요! 먼저 풀어보세요 😊`);return;}
  }
  viewMode=mode;
  weakPctActive=(mode==='weak')?weakPct:null;
  updateViewBtns(mode, weakPct);
  applyViewFilter(mode, weakPct);
}

/* 자주틀림 드롭다운 */

/* ── 카드 생성 ── */
function mkCard(q){
  const id='q'+q.n;
  const isOk=okSet.has(q.n),isNg=wrongSet.has(q.n);
  const answered=isOk||isNg;
  const tags=``;
  const at=attemptMap[q.n];
  const atTag=atHtml(at);

  let opts=[...q.o],dispAns=q.ans;
  if(shufMode){
    if(!shufMap[id]){const sh=shuf([0,1,2,3]);shufMap[id]={order:sh,newAns:sh.indexOf(q.ans-1)+1};}
    opts=shufMap[id].order.map(i=>q.o[i]);dispAns=shufMap[id].newAns;
  }

  const savedSel=selectedMap[q.n]?.sel??null;

  const optHtml=opts.map((o,i)=>{
    const pos=i+1;
    let cls='opt';
    if(answered){
      cls+=' lk';
      if(pos===dispAns) cls+=' cor';
      if(savedSel!==null && pos===savedSel && savedSel!==dispAns) cls+=' wrg';
    }
    return `<div class="${cls}" id="${id}_p${pos}" onclick="sel('${id}',${pos},${dispAns})">
      <span class="on">${N[i]}</span><span>${o}</span>
    </div>`;
  }).join('');

  const resShow=answered?'show':'';
  const aeHtml=q.ae?`
    <div class="expl ae-expl">
      <div class="ae-label">✦ 추가 해설 (AI)</div>
      ${q.ae}
    </div>`:'';

  const cnCls=isOk?'cn ok':isNg?'cn ng':'cn';
  const cardCls=`card${isOk?' answered-ok':isNg?' answered-ng':''}`;
  const bmCls=bookmarkSet.has(q.n)?'bm-icon on':'bm-icon';
  return `<div class="${cardCls}" id="${id}" data-n="${q.n}">
  <div class="ch">
    <div class="${cnCls}">${q.n}</div>
    <div class="ct">
      <div class="tags">${tags}${atTag}</div>
      <div class="qt">${q.q}</div>
    </div>
    <button class="${bmCls}" onclick="toggleBM(event,${q.n})" title="북마크">⭐</button>
  </div>
  <div class="opts" id="${id}_opts">${optHtml}</div>
  <div class="res-bar ${resShow}" id="${id}_res">
    <div class="ansbar">
      <span class="albl">정답</span>
      <span class="aval">${N[dispAns-1]} ${opts[dispAns-1]}</span>
      <button class="rtbtn" onclick="reset('${id}')">↺ 다시풀기</button>
    </div>
    <div class="expl">${q.e}</div>
    ${aeHtml}
  </div>
</div>`;
}

/* 보기 선택 */
function sel(id,n,dispAns){
  const os=document.querySelectorAll(`#${id}_opts .opt`);
  if(os[0].classList.contains('lk'))return;
  os.forEach(o=>o.classList.add('lk'));
  const qn=parseInt(id.replace('q',''));
  const isCorrect=n===dispAns;

  /* 마지막 푼 문제 기록 */
  lastSeenN=qn;

  /* 시도 기록 */
  if(!attemptMap[qn]) attemptMap[qn]={try:0,ok:0};
  attemptMap[qn].try++;
  if(isCorrect) attemptMap[qn].ok++;
  /* 카드 상단 시도 표시 갱신 */
  const atEl=document.querySelector(`#q${qn} .tg-at`);
  if(atEl){
    const at=attemptMap[qn];
    atEl.textContent=`${at.ok}/${at.try}`;
    atEl.className=`tg tg-at ${atCls(at)}`;
  }

  /* 선택 저장 */
  selectedMap[qn]={sel:n,dispAns};

  if(isCorrect){
    document.getElementById(`${id}_p${n}`).classList.add('cor');
    okSet.add(qn);wrongSet.delete(qn);
    document.getElementById(id).className='card answered-ok';
    document.querySelector(`#${id} .cn`).className='cn ok';
  } else {
    document.getElementById(`${id}_p${n}`).classList.add('wrg');
    document.getElementById(`${id}_p${dispAns}`).classList.add('cor');
    wrongSet.add(qn);okSet.delete(qn);
    document.getElementById(id).className='card answered-ng';
    document.querySelector(`#${id} .cn`).className='cn ng';
  }

  const res=document.getElementById(`${id}_res`);
  res.classList.add('show');
  renderMath(res);

  upStat();
  saveState();
}

function reset(id){
  const n=parseInt(id.replace('q',''));
  /* 상태 초기화 */
  wrongSet.delete(n); okSet.delete(n); delete selectedMap[n];
  if(shufMode) delete shufMap[id];
  /* DOM 초기화 */
  document.querySelectorAll(`#${id}_opts .opt`).forEach(o=>o.className='opt');
  document.getElementById(`${id}_res`).classList.remove('show');
  document.getElementById(id).className='card';
  document.querySelector(`#${id} .cn`).className='cn';
  document.getElementById(id).style.display='';
  upStat();
  saveState();
  /* 오답 뷰에서 오답이 0개가 되면 전체 뷰로 전환 */
  if(viewMode==='ng' && wrongSet.size===0) setView('all');
}

function resetAll(){
  wrongSet.clear(); okSet.clear();
  shufMap={}; selectedMap={}; randedOrder=null; shufMode=false;
  /* attemptMap·bookmarkSet 유지 */
  viewMode='all'; weakPctActive=null; lastSeenN=null; bmMode=false;
  /* 버튼 초기화 */
  document.getElementById('btnBM').classList.remove('on');
  document.querySelector('#btnWeak .lbl').textContent='자주틀림';
  updateViewBtns('all');
  render(); upStat(); saveState();
}

function toggleMenu(){
  document.getElementById('menuPanel').classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('open');
}

function toggleBM(e,n){
  e.stopPropagation();
  const btn=e.currentTarget;
  if(bookmarkSet.has(n)){bookmarkSet.delete(n);btn.classList.remove('on');}
  else{bookmarkSet.add(n);btn.classList.add('on');}
  btn.blur();
  saveState();
  if(viewMode==='bm') setView('bm');
}

function toggleBookmark(b){
  bmMode=!bmMode;
  b.classList.toggle('on', bmMode);
  if(bmMode){
    if(bookmarkSet.size===0){
      alert('북마크한 문제가 없어요! 문제 옆 ★을 눌러 추가하세요.');
      bmMode=false; b.classList.remove('on'); return;
    }
    viewMode='bm'; applyViewFilter('bm');
    updateViewBtns('bm');
  } else {
    viewMode='all'; applyViewFilter('all');
    updateViewBtns('all');
  }
}

function toggleFormulaSheet(){
  const page=document.getElementById('formulaPage');
  const isOpen=page.classList.toggle('open');
  /* 메인 페이지 스크롤 잠금 */
  document.body.style.overflow=isOpen?'hidden':'';
  if(isOpen) renderFormulaSheet();
}

/* ── 공식모음 데이터 (전자기학 공식 정리) ── */
const R=(l,m)=>`<div class="fr"><span class="fl">${l}</span><span class="fm">\\(${m}\\)</span></div>`;
const T=t=>`<div class="fsub">${t}</div>`;
const NT=t=>`<div class="fnote">${t}</div>`;
const FORMULA_SHEET=[
 {title:'1. 자계의 세기 H', html:
  R('무한장 직선 도체',String.raw`H=\dfrac{I}{2\pi r}\ [\text{AT/m}]`)+
  R('원형코일 중심',String.raw`H=\dfrac{NI}{2r}\ [\text{AT/m}]`)+
  R('환상 솔레노이드 내부',String.raw`H=\dfrac{NI}{2\pi r}\ [\text{AT/m}]`)+
  R('무한장 솔레노이드 내부',String.raw`H=n_0I\ [\text{AT/m}]`)+
  R('점자극',String.raw`H=6.33\times10^{4}\dfrac{m}{\mu_s r^{2}}\ [\text{AT/m}]`)},
 {title:'2. 자기력', html:
  T('쿨롱의 법칙 (두 자극 사이의 힘)')+
  R('',String.raw`F=6.33\times10^{4}\dfrac{m_1m_2}{\mu_s r^{2}}=\dfrac{m_1m_2}{4\pi\mu_0\mu_s r^{2}}\ [\text{N}]`)+
  T('자극이 받는 힘')+R('',String.raw`F=mH\ [\text{N}]`)+
  T('평행 도선 사이의 힘')+R('',String.raw`F=\dfrac{2I_1I_2}{r}\times10^{-7}\ [\text{N/m}]`)+
  T('자계 속 도체가 받는 힘')+R('',String.raw`F=BlI\sin\theta\ [\text{N}]`)},
 {title:'3. 자속밀도, 자기량', html:
  R('자속밀도',String.raw`B=\mu H=\dfrac{\phi}{A}\ [\text{Wb/m}^2]`)+
  R('자기모멘트',String.raw`M=m\ell\ [\text{Wb}\cdot\text{m}]`)+
  R('자기력선 수',String.raw`N=\dfrac{m}{\mu}`)},
 {title:'4. 인덕턴스', html:
  T('유기기전력')+R('',String.raw`e=-L\dfrac{di}{dt}=-N\dfrac{d\phi}{dt}`)+
  T('자기 인덕턴스 유도')+R('',String.raw`\phi=\dfrac{\mu ANI}{l},\quad LI=N\phi`)+
  R('',String.raw`\Rightarrow L=\dfrac{\mu AN^{2}}{l}=\dfrac{\mu_0\mu_sAN^{2}}{l}=4\pi\times10^{-7}\dfrac{\mu_sAN^{2}}{l}\ [\text{H}]`)+
  T('합성 인덕턴스')+R('',String.raw`L=L_1+L_2\pm2M`)+
  NT('가동접속 +2M, 차동접속 −2M')+
  T('결합계수')+R('',String.raw`k=\dfrac{M}{\sqrt{L_1L_2}}\quad(0\le k\le1)`)},
 {title:'5. 자기저항', html:
  R('',String.raw`R_m=\dfrac{F}{\phi}=\dfrac{l}{\mu A}\ [\text{AT/Wb}]`)+
  NT('F = NI 는 기자력, 자기회로의 옴의 법칙: \\(\\phi=\\dfrac{NI}{R_m}\\)')},
 {title:'6. 에너지', html:
  R('코일에 저장되는 에너지',String.raw`W=\dfrac12LI^{2}\ [\text{J}]`)+
  R('단위체적당 저장에너지',String.raw`w=\dfrac12BH=\dfrac12\mu H^{2}=\dfrac{B^{2}}{2\mu}\ [\text{J/m}^3]`)},
 {title:'7. 철손', html:
  R('히스테리시스손',String.raw`P_h=kfB_m^{1.6}`)+
  R('와류손',String.raw`P_e=kf^{2}B_m^{2.0}`)},
 {title:'💡 암기 포인트', html:
  R('',String.raw`6.33\times10^{4}=\dfrac{1}{4\pi\mu_0}`)+
  R('',String.raw`L\propto N^{2},\quad L\propto\dfrac{1}{l}`)+
  NT('분모 주의: 직선 2πr / 원형코일 중심 2r / 환상 솔레노이드 2πr')}
];

function renderFormulaSheet(){
  const body=document.getElementById('fsBody');
  let h=FORMULA_SHEET.map(f=>`
    <div class="fc">
      <div class="fc-title">${f.title}</div>
      <div class="fc-body">${f.html}</div>
    </div>`).join('');
  h+=QS.filter(q=>q.formula).map(q=>`
    <div class="fc">
      <div class="fc-title">Q${q.n}. ${q.q.replace(/<[^>]*>/g,'').substring(0,40)}${q.q.length>40?'…':''}</div>
      <div class="fc-body">${q.formula}</div>
    </div>`).join('');
  body.innerHTML=h;
  renderMath(body);
}

/* 순서섞기 — 섞인 순서를 유지 */
function doRand(){
  randedOrder = shuf(QS.filter(q=>q.n!=null).map(q=>q.n));
  render();
  setTimeout(()=>{ document.activeElement?.blur(); }, 100);
}
/* 보기섞기 — 순서는 그대로, 보기 배치만 새로 섞기 */
function doShuf(){
  shufMap={}; shufMode=true; render();
  setTimeout(()=>{ document.activeElement?.blur(); }, 100);
}

/* ── 주관식 렌더 ── */
function renderSQ(){
  const wrap=document.getElementById('sq-wrap');
  if(!SQS.length){wrap.style.display='none';return;}
  wrap.innerHTML=`<div class="sq-divider"><span>📝 주관식</span></div>`+SQS.map(s=>{
    if(s.type==='fill'){
      return `<div class="sq-card" id="${s.id}">
  <div class="sq-hd">
    <div class="sq-num">주</div>
    <div><div class="sq-title">${s.title}</div><div class="sq-sub">${s.sub||'빈칸을 채워보세요'}</div></div>
  </div>
  <div class="sq-body">
    <div class="sq-sent">${s.sent}</div>
    <div class="sq-btns">
      <button class="sq-btn-check" onclick="sqCheck('${s.id}')">✓ 채점하기</button>
      <button class="sq-btn-sub" onclick="sqShowAll('${s.id}')">정답 보기</button>
      <button class="sq-btn-sub" onclick="sqReset('${s.id}')">↺ 다시풀기</button>
    </div>
    <div class="sq-score" id="${s.id}_score"></div>
  </div>
</div>`;
    } else {
      return `<div class="sq-card" id="${s.id}">
  <div class="sq-hd">
    <div class="sq-num">주</div>
    <div><div class="sq-title">${s.title}</div><div class="sq-sub">공식을 떠올린 후 정답을 확인하세요</div></div>
  </div>
  <div class="sq-body">
    <div class="sq-formula-box">
      <span style="color:var(--tx3);font-size:.78rem;display:block;margin-bottom:6px;">공식을 써보세요</span>
      <span style="color:var(--ac2);font-size:1.05rem;font-style:italic;">${s.hint}</span>
    </div>
    <button class="sq-show-btn" onclick="sqToggle('${s.id}',this)">🔍 정답 보기</button>
    <div class="sq-ans-box" id="${s.id}_ans">${s.ans}</div>
  </div>
</div>`;
    }
  }).join('');
  /* 번호 순서대로 주N 표시 */
  wrap.querySelectorAll('.sq-num').forEach((el,i)=>el.textContent='주'+(i+1));
  renderMath(wrap);
}

function sqCheck(id){
  const sc=document.getElementById(`${id}_score`);
  const inps=sc.closest('.sq-body').querySelectorAll('.sq-inp');
  let ok=0;
  inps.forEach(inp=>{
    inp.classList.remove('cor','wrg');
    if(inp.value.trim()===inp.dataset.ans){inp.classList.add('cor');ok++;}
    else inp.classList.add('wrg');
  });
  sc.className='sq-score '+(ok===inps.length?'ok':'ng');
  sc.textContent=ok===inps.length?'🎉 모두 정답!':`${ok} / ${inps.length} 정답 — 틀린 칸을 확인해보세요`;
}
function sqShowAll(id){
  const sc=document.getElementById(`${id}_score`);
  sc.closest('.sq-body').querySelectorAll('.sq-inp').forEach(inp=>{inp.value=inp.dataset.ans;inp.classList.remove('wrg');inp.classList.add('cor');});
  sc.className='sq-score ok';sc.textContent='정답을 확인했습니다 ✓';
}
function sqReset(id){
  const sc=document.getElementById(`${id}_score`);
  sc.closest('.sq-body').querySelectorAll('.sq-inp').forEach(inp=>{inp.value='';inp.classList.remove('cor','wrg');});
  sc.className='sq-score';sc.textContent='';
}
function sqToggle(id,btn){
  const box=document.getElementById(`${id}_ans`);
  const showing=box.classList.toggle('show');
  btn.textContent=showing?'🙈 정답 숨기기':'🔍 정답 보기';
  if(showing) renderMath(box);
}

/* 터치 기기 :active 고착 방지 — touchend 후 0.1초 뒤 blur */
document.addEventListener('touchend', e=>{
  const btn=e.target.closest('button,.stat-btn');
  if(btn) setTimeout(()=>btn.blur(), 100);
}, {passive:true});

/* 초기화 */
loadState();
render();
renderSQ();

/* 마지막 푼 문제로 스크롤 */
if(lastSeenN){
  requestAnimationFrame(()=>{
    const el=document.getElementById('q'+lastSeenN);
    if(el) el.scrollIntoView({behavior:'instant',block:'center'});
  });
}

/* 맨 위로 버튼 — 화면 높이 2배 이상 스크롤 시 표시 */
window.addEventListener('scroll',()=>{
  const btn=document.getElementById('topBtn');
  btn.classList.toggle('visible', window.scrollY > 300);
},{passive:true});

/* ── 답 전체보기 (보기 전용 · 풀이 기록에 반영 안 됨) ── */
let revealAll=false;
function revealCard(card){
  if(card.dataset.rv||card.classList.contains('answered-ok')||card.classList.contains('answered-ng')) return;
  const os=card.querySelectorAll('.opts .opt');
  if(!os.length||os[0].classList.contains('lk')) return;
  const m=(os[0].getAttribute('onclick')||'').match(/,(\d+)\)/);
  if(!m) return;
  os.forEach(o=>o.classList.add('lk'));
  const ca=card.querySelector('#'+card.id+'_p'+m[1]); if(ca) ca.classList.add('cor');
  const res=document.getElementById(card.id+'_res');
  if(res){res.classList.add('show');renderMath(res);}
  card.dataset.rv='1';
}
function unrevealCard(card){
  if(!card.dataset.rv) return;
  card.querySelectorAll('.opts .opt').forEach(o=>o.className='opt');
  const res=document.getElementById(card.id+'_res'); if(res) res.classList.remove('show');
  delete card.dataset.rv;
}
function applyReveal(){
  document.querySelectorAll('#main .card').forEach(c=>revealAll?revealCard(c):unrevealCard(c));
  document.getElementById('btnReveal').classList.toggle('on',revealAll);
}
function toggleReveal(){revealAll=!revealAll;applyReveal();}
(function(){const _r=render;render=function(){_r.apply(this,arguments);if(revealAll)applyReveal();};})();
</script>
